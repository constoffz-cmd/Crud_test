<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cars</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<h2 style="text-align: center">Таблица автомобилей</h2>

<table>
    <thead>
    <tr>
        <th>Модель</th>
        <th>Серия</th>
        <th>Год выпуска</th>
    </tr>
    </thead>
    <tbody>
    <!-- Итерация по списку машин с помощью Thymeleaf -->
    <tr th:each="car : ${cars}">
        <td th:text="${car.getModel()}">Model</td>
        <td th:text="${car.getSeries()}">Series</td>
        <td th:text="${car.getYearRelease()}">Year</td>
    </tr>
    </tbody>
</table>
<img src="imag.png">
</body>
</html>
